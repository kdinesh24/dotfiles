# Port of Oh My Zsh theme "avit" to Starship.
# ======
# Supports: Java, Node.JS, PHP, Go, Crystal, Python, Ruby, and Rust modules
# Directory and Git modules included

add_newline = false
format = """\
  $crystal$golang$java$nodejs$php$python$ruby$rust\
  $directory\
  $git_branch$git_commit$git_state$git_status\
  $character\
"""

[character]
success_symbol = "[ ➤]($bold fg:#f8f8f2)"
error_symbol = "[ ➤]($bold fg:#fb4934)"

[directory]
disabled = false
format = "[ $path](bold fg:#ffc799)"
truncate_to_repo = false

[git_status]
format = " ([$all_status$ahead_behind](bold fg:#99ffe4))"
staged = "• "
modified = "~ "
untracked = "+ "
deleted = "x "

[git_branch]
format = " [ $branch](bold fg:#99ffe4)"

[python]
# Removed version details
format = " [${symbol}(\\($virtualenv\\) )](fg:#ffb86c)"
symbol = ""
pyenv_version_name = false
detect_extensions = ["py"]
detect_files = ["requirements.txt", ".python-version", "Pipfile", "pyproject.toml"]

[nodejs]
# Removed version details
format = " [${symbol}](fg:#8be9fd)"
symbol = ""
detect_extensions = ["js", "mjs", "cjs", "ts"]
detect_files = ["package.json", ".node-version", ".nvmrc"]

[java]
# Removed version details
format = " [${symbol}](fg:#fb4934)"
symbol = ""
detect_extensions = ["java", "class", "jar", "gradle", "clj", "cljc"]
detect_files = ["pom.xml", "build.gradle.kts", "build.sbt", "deps.edn"]

[golang]
# Removed version details
format = " [${symbol}](fg:#8be9fd)"
symbol = ""
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[rust]
# Removed version details
format = " [${symbol}](fg:#fb4934)"
symbol = ""
detect_extensions = ["rs"]
detect_files = ["Cargo.toml", "Cargo.lock"]

[php]
# Removed version details
format = " [${symbol}](fg:#bd93f9)"
symbol = ""
detect_extensions = ["php"]
detect_files = ["composer.json", ".php-version"]

[ruby]
# Removed version details
format = " [${symbol}](fg:#fb4934)"
symbol = ""
detect_extensions = ["rb"]
detect_files = ["Gemfile", ".ruby-version"]

[crystal]
# Removed version details
format = " [${symbol}](fg:#f8f8f2)"
symbol = ""
detect_extensions = ["cr"]
detect_files = ["shard.yml"]

[docker_context]
format = " [${symbol}$context](bold fg:#8be9fd)"
symbol = ""
only_with_files = true
disabled = true

[kubernetes]
format = " [${symbol}$context( \\($namespace\\))](bold fg:#bd93f9)"
symbol = ""
disabled = true

[aws]
format = " [${symbol}($profile )(\\($region\\) )](bold fg:#ffb86c)"
symbol = ""
disabled = true

[package]
format = " [$version](bold fg:#f1fa8c)"
symbol = ""
disabled = true
